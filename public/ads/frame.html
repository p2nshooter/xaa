<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Advertisement</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!--
      One Adsterra banner, in its own document on THIS site's own origin.

      WHY A REAL FILE INSTEAD OF srcdoc. Every banner needs its own document,
      because invoke.js reads a single global `atOptions` and two banners on one
      page would clobber each other. The obvious way to get a private document
      is an `srcdoc` iframe — and it was, and it silently broke every banner on
      every site in the network.

      Inside `about:srcdoc` a document has no identity:

        location.hostname   ""            (empty)
        location.origin     "null"        (an opaque origin)
        document.referrer   ""            (empty)

      invoke.js identifies the publisher by domain and referrer. Given none of
      the three it cannot match the request to a registered website, so it
      returns no ad at all. The slot loads, the script runs, nothing paints —
      which looks exactly like "no fill" and is not.

      Loaded as a real file from our own origin, the frame reports the site's
      true hostname, origin and referrer, and the isolation is unchanged:
      each frame is still its own document with its own `atOptions`.
    -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var key = (q.get('key') || '').toLowerCase();
        var w = parseInt(q.get('w'), 10);
        var h = parseInt(q.get('h'), 10);

        // The query string is attacker-controllable — this page is reachable
        // by URL. Only a 32-character hex key may ever reach the script src,
        // or the page becomes a way to run arbitrary third-party JavaScript
        // on our own origin.
        if (!/^[0-9a-f]{32}$/.test(key)) return;
        if (!(w > 0 && w <= 2000) || !(h > 0 && h <= 2000)) return;

        window.atOptions = { key: key, format: 'iframe', height: h, width: w, params: {} };
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.src = 'https://www.highperformanceformat.com/' + key + '/invoke.js';
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
