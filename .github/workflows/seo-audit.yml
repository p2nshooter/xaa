name: SEO audit
# Audits every domain in scripts/seo-audit.mjs (owner, 27 Oct 2026: "perbaiki dulu
# seluruh SEO websitenya … d seluruh situs") against the SEO checklist and records
# the result in src/content/seo-audit.json (shown at /portal/admin/seo) and
# docs/seo/REPORT.md. Weekly, and on demand from the Actions tab; the `domains`
# input narrows a run to some of them.
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      domains:
        description: 'Space-separated domains to audit (empty = all)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: seo-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    # 38 domains take about 15–30 minutes; a hang ends the job instead of holding the runner for 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit
        run: node scripts/seo-audit.mjs $DOMAINS
        env:
          DOMAINS: ${{ inputs.domains || '' }}
          PSI_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          LIGHTHOUSE: '1'
      - name: Show report
        run: cat docs/seo/REPORT.md | head -40
      # Commits only when the findings changed. A push made with GITHUB_TOKEN
      # does not trigger other workflows, so the deploy is started explicitly —
      # workflow_dispatch is the one event that token is allowed to fire.
      - name: Record results and redeploy
        run: |
          set -e
          git config user.name "xaa-seo-audit"
          git config user.email "seo-audit@users.noreply.github.com"
          git add src/content/seo-audit.json docs/seo/REPORT.md
          if git diff --cached --quiet; then
            echo "No change in findings."
            exit 0
          fi
          git commit -m "SEO audit: record findings"
          git push
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
