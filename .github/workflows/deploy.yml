name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE secrets not set — build OK but deploy SKIPPED. Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID and re-run."
          fi
      # Creates the portal's D1 database and R2 bucket if they are missing, and
      # writes the database_id into wrangler.jsonc. Runs before the build so the
      # worker is bundled against real bindings.
      - name: Prepare Cloudflare resources
        if: steps.cf.outputs.ok == 'true'
        run: bash scripts/ensure-cloudflare-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # next/font downloads the Google Fonts CSS while it builds. On
      # 2026-10-03 Google answered with CSS the loader could not parse
      # ("Cannot read properties of null (reading '1')" in next/font) and the
      # deploy died, though the same commit builds locally. A failure that
      # names next/font is retried twice; any other build error fails at once.
      - name: Build for Cloudflare
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run cf:build 2>&1 | tee /tmp/build.log; then exit 0; fi
            if ! grep -q "An error occurred in \`next/font\`" /tmp/build.log; then exit 1; fi
            echo "::warning::next/font could not fetch Google Fonts (attempt $attempt) — retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Ensure workers.dev subdomain
        if: steps.cf.outputs.ok == 'true'
        run: |
          set -e
          current=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          existing=$(node -e "try{const d=JSON.parse(process.argv[1]);process.stdout.write(d.result&&d.result.subdomain?d.result.subdomain:'')}catch(e){}" "$current")
          if [ -z "$existing" ]; then
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"subdomain":"xaa"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ok == 'true'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Sessions are HMAC-signed cookies keyed by SESSION_SECRET. Created ONCE:
      # rotating it would sign everyone out, so an existing secret is never
      # replaced, and if the list call fails we leave things alone rather than
      # guess. It is separate from AUTH_SECRET/SETTINGS_KEY on purpose — those
      # feed the at-rest encryption key, which must not change under stored data.
      - name: Ensure session secret
        if: steps.cf.outputs.ok == 'true'
        run: |
          set -uo pipefail
          list=$(npx wrangler secret list --name xaa-es 2>/dev/null) || { echo "::warning::Could not list Worker secrets; SESSION_SECRET left as is."; exit 0; }
          if grep -q '"SESSION_SECRET"' <<<"$list"; then
            echo "SESSION_SECRET already set"
          else
            openssl rand -hex 32 | npx wrangler secret put SESSION_SECRET --name xaa-es >/dev/null && echo "SESSION_SECRET created"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Points xaa.es and www.xaa.es at this worker.
      #
      # `override_existing_origin` is load-bearing: both hostnames were already
      # held by another worker in the same account, and without it Cloudflare
      # answers 100116 ("Hostname already in use by other custom domain") and
      # nothing moves. This step used to be continue-on-error, so it failed that
      # way on 105 consecutive runs while every run still reported success and
      # the domain kept serving the other project. It now fails the job instead.
      - name: Attach custom domain + DNS
        if: steps.cf.outputs.ok == 'true'
        run: |
          set -uo pipefail
          zone=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=xaa.es" | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write((d.result&&d.result[0]&&d.result[0].id)||'')}catch(e){}")
          if [ -z "$zone" ]; then
            echo "::error::Zone xaa.es is not visible to this API token. Give it Zone:Read on xaa.es, or attach the domain once by hand."
            exit 1
          fi
          failed=0
          for host in xaa.es www.xaa.es; do
            # A custom domain is served by the Workers route, so a stale A /
            # AAAA / CNAME on the same name would shadow it.
            for type in A AAAA CNAME; do
              ids=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?type=$type&name=$host" | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));(d.result||[]).forEach(r=>console.log(r.id))}catch(e){}")
              for id in $ids; do curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$id" > /dev/null; done
            done
            response=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"hostname\":\"$host\",\"zone_id\":\"$zone\",\"service\":\"xaa-es\",\"environment\":\"production\",\"override_existing_origin\":true,\"override_existing_dns_record\":true}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
            echo "$response"
            ok=$(node -e "try{const d=JSON.parse(process.argv[1]);process.stdout.write(d.success?'yes':'no')}catch(e){process.stdout.write('no')}" "$response")
            if [ "$ok" != "yes" ]; then
              echo "::error::Failed to attach $host to the xaa-es worker."
              failed=1
            else
              echo "Attached $host to xaa-es"
            fi
          done
          exit $failed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # HTTP → HTTPS at the edge. The middleware also redirects when Cloudflare
      # reports an HTTP visit, but the zone setting is the first line: it answers
      # before the Worker runs. Non-fatal — the token may lack Zone Settings:Edit,
      # in which case the log says so and the middleware still covers it.
      - name: Always use HTTPS
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          zone=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=xaa.es" | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write((d.result&&d.result[0]&&d.result[0].id)||'')}catch(e){}")
          [ -z "$zone" ] && { echo "::warning::zone not visible to token"; exit 0; }
          r=$(curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"value":"on"}' "https://api.cloudflare.com/client/v4/zones/$zone/settings/always_use_https")
          node -e "const d=JSON.parse(process.argv[1]);console.log(d.success?'Always Use HTTPS: on':'Always Use HTTPS not changed: '+JSON.stringify(d.errors))" "$r"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pushes the portal's runtime configuration from repository secrets, so
      # payment addresses never live in the repo. Each is optional: one that is
      # not set is skipped, and the payment screen says so plainly rather than
      # showing an empty box.
      - name: Sync optional Worker secrets
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          put() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --name xaa-es >/dev/null 2>&1 \
                && echo "set $name" || echo "could not set $name"
            else
              echo "skipped $name (not set in GitHub secrets)"
            fi
          }
          put ADMIN_EMAIL        "${{ secrets.ADMIN_EMAIL }}"
          put USDT_TRC20_ADDRESS "${{ secrets.USDT_TRC20_ADDRESS }}"
          put USDT_ERC20_ADDRESS "${{ secrets.USDT_ERC20_ADDRESS }}"
          put USDT_BEP20_ADDRESS "${{ secrets.USDT_BEP20_ADDRESS }}"
          put PAYPAL_EMAIL       "${{ secrets.PAYPAL_EMAIL }}"
          put PAYPAL_LINK        "${{ secrets.PAYPAL_LINK }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Eyes on production. The build environment cannot reach xaa.es, but this
      # runner can: print the credential-free health report and the status of
      # the key pages, so every deploy's log shows whether sign-in is ready and
      # whether D1 is answering. Informational — it never fails the deploy.
      - name: Post-deploy smoke test
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5 6; do
            body=$(curl -s --max-time 20 "https://xaa.es/api/health?ts=$(date +%s)")
            if grep -q '"signInReady": true' <<<"$body"; then break; fi
            sleep 10
          done
          echo "── /api/health ──"; echo "$body"
          echo "── page status ──"
          for path in / /login /register /services /templates /portfolio /company /care /payments /faq /about /contact /sitemap.xml /robots.txt /llms.txt /portal /portal/admin; do
            code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "https://xaa.es$path")
            echo "$code  $path"
          done
          echo "── canonical origin ──"
          for u in http://xaa.es/services https://www.xaa.es/services http://www.xaa.es/; do
            echo "$(curl -s -o /dev/null --max-time 20 -w '%{http_code} → %{redirect_url}' "$u")  $u"
          done
          echo "── security headers ──"
          curl -sI --max-time 20 https://xaa.es/ | grep -iE '^(strict-transport|x-content-type|x-frame|referrer-policy|permissions-policy|content-security)' || echo "none found"
          echo "── head metadata by language ──"
          for q in "" "?lang=es" "?lang=id"; do
            page=$(curl -s --max-time 20 "https://xaa.es/services$q")
            head=${page%%</head>*}
            title=$(grep -o '<title>[^<]*' <<<"$head" | head -1 | sed 's/<title>//')
            canon=$(grep -o '<link rel="canonical" href="[^"]*"' <<<"$head" | head -1 | sed 's/.*href="//;s/"$//')
            hl=$(grep -o 'hrefLang="[^"]*"' <<<"$head" | tr '\n' ' ')
            echo "/services$q | $title | canonical=$canon | $hl"
          done

